    <section class="container py-5">
        <div class="row g-4">
            <!-- columna izq -->
            <div class="col-12 col-md-4">

                <h2>Índice</h2>
                <p>Mis pendientes</p>

                <!-- Filtros -->
                <div class="filtros-tareas">

                    <h5>Organizar tareas</h5>

                    <div class="mb-3">
                        <label for="filtroEstado" class="form-label">Estado</label>
                        <select class="form-select" id="filtroEstado">
                            <option value="Todas">Todas</option>
                            <option value="Pendiente">Pendientes</option>
                            <option value="En progreso">En progreso</option>
                            <option value="Completada">Completadas</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="buscarTarea" class="form-label">Buscar tarea</label>
                        <input type="search" class="form-control" id="buscarTarea" placeholder="Nombre de la tarea...">
                    </div>

                    <div class="mb-3">
                        <label for="ordenarTareas" class="form-label">Ordenar por</label>
                        <select class="form-select" id="ordenarTareas">
                            <option value="recientes">Más recientes</option>
                            <option value="antiguas">Más antiguas</option>
                        </select>
                    </div>

                </div>

                <hr>

                <!-- Lista dinámica de tareas -->
                <h5>Lista de tareas</h5>
                <ul id="lista">
                    <!-- Los títulos se generan desde JavaScript -->
                </ul>

                <!-- Botón para crear tareas -->
                <button type="button" id="nuevaTarea" class="btn btn-primary" data-bs-toggle="modal"
                    data-bs-target="#modalTarea">
                    Nueva tarea
                </button>

            </div>

            <!-- columna der -->
            <div class="col-12 col-md-8">
                <p id="fecha">fecha del día Poner en js</p>
                <h2>Mis apuntes</h2>


                <div class="row">
                    <section id="seccion-tareas" class="catalogo mb-5">
                        <div id="catalogoTareas" class="row g-4">
                            <!--acaá iba la estatica, ya se borró porq se volvió dinamico-->
                        </div>
                    </section>
                </div>
            </div>
        </div>

    </section>
    <div class="modal fade" id="modalTarea" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">Nueva tarea</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="alertaValidacion" class="alert alert-danger d-none" role="alert">
                        Por favor, revisa los campos del formulario.
                    </div>
                    <div class="mb-3">
                        <label for="nombreTarea" class="form-label">Nombre de la tarea</label>
                        <input type="text" class="form-control" id="nombreTarea" placeholder="Ej. Estudiar JavaScript">
                    </div>
                    <div class="mb-3">
                        <label for="descripcionTarea" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcionTarea" rows="3"
                            placeholder="Descripción la tarea"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                        <input type="date" class="form-control" id="fechaInicio">
                    </div>

                    <div class="mb-3">
                        <label for="fechaFinalizacion" class="form-label">Fecha tentativa de finalización</label>
                        <input type="date" class="form-control" id="fechaFinalizacion">
                    </div>
                    <div class="mb-3">
                        <label for="notaTarea" class="form-label">Nota adicional</label>
                        <textarea class="form-control" id="notaTarea" rows="3"
                            placeholder="Escribe alguna nota o recordatorio..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="colorTarea" class="form-label">Color de la tarea</label>
                        <input type="color" class="form-control form-control-color" id="colorTarea" value="#d8c4e8">
                    </div>
                    <div class="mb-3">
                        <label for="estadoTarea" class="form-label">Estado</label>
                        <select class="form-select" id="estadoTarea">
                            <option value="" selected disabled>Selecciona un estado</option>
                            <option value="Pendiente">Pendiente</option>
                            <option value="En progreso">En progreso</option>
                            <option value="Completada">Completada</option>
                        </select>
                    </div> <!--se agrega para ponerle un estado(me había faltado)-->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" id="guardarTarea">
                        Guardar tarea
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
